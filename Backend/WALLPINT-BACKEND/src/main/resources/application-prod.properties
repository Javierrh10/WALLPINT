# === Base de datos en producci贸n (Render PostgreSQL) ===
# Render no da DATABASE_URL en formato JDBC, as铆 que usamos variables
# individuales que rellenamos desde el dashboard de Render con los datos
# de la BD (Internal Hostname, Database, Username, Password).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === JWT ===
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# === Servidor ===
server.port=${PORT:8080}

# === Jackson (fechas ISO-8601, no como array) ===
spring.jackson.serialization.write-dates-as-timestamps=false
